name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          ./scripts/check-toolchain.sh
      - name: Core tests
        run: swift test
      - name: Build and test app
        run: ./scripts/test.sh -resultBundlePath build/TestResults.xcresult
      - name: Universal release build without distribution credentials
        run: ./scripts/build.sh Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/TestResults.xcresult
